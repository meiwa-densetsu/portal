<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>リンク集の管理｜名和電設ポータル</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css?v=25">
<script src="js/boot.js?v=25" defer></script>
<script src="js/sw_register.js?v=25" defer></script>
<script src="js/config.js?v=25" defer></script>
<script src="js/store.js?v=25" defer></script>
<script src="js/ui.js?v=25" defer></script>
<script src="js/api.js?v=25" defer></script>
<script src="js/report.js?v=25" defer></script>
<script src="js/guard.js?v=25" defer></script>
<script src="gen/calc_task.js?v=25" defer></script>
<script src="js/remind.js?v=25" defer></script>
<script src="js/portal_text.js?v=25" defer></script>
<script src="js/page_admin_links.js?v=25" defer></script>
</head>
<body hidden>
<header id="topbar" class="topbar" hidden></header>
<main class="wrap">
<div id="msg" class="msg error" role="alert" hidden></div>
<div id="admin" hidden>
  <h1>リンク集の管理</h1>
  <div class="card">
    <p class="sub">社員のホームに出すリンクです（Instagram・自社のホームページなど）。https:// で始まる住所だけを入れられます。</p>
    <ul id="link-list" class="list"></ul>
    <div class="item-actions"><button type="button" id="add" class="btn primary">リンクを足す</button></div>
  </div>
  <form id="edit-view" class="card" novalidate hidden>
    <h2 id="edit-title">リンクを足す</h2>
    <div class="field"><label for="l-name">名前</label><input type="text" id="l-name" maxlength="100" autocomplete="off"></div>
    <div class="field"><label for="l-url">住所（URL）</label><input type="text" id="l-url" maxlength="2000" autocomplete="off" inputmode="url"></div>
    <div class="field"><label for="l-order">表示順</label><input type="text" id="l-order" inputmode="numeric" maxlength="4" autocomplete="off"></div>
    <label class="check" for="l-show"><input type="checkbox" id="l-show" checked> ホームに出す</label>
    <button type="submit" class="btn primary block">保存する</button>
    <button type="button" id="l-delete" class="btn danger block" hidden>このリンクを消す</button>
    <button type="button" id="l-cancel" class="btn block">やめる</button>
  </form>
  <a class="btn block" href="home.html">ホームへ戻る</a>
</div>
</main>
</body>
</html>
