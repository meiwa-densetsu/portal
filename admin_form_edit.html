<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>受付項目を作る・直す｜名和電設ポータル</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css?v=27">
<script src="js/boot.js?v=27" defer></script>
<script src="js/sw_register.js?v=27" defer></script>
<script src="js/config.js?v=27" defer></script>
<script src="js/store.js?v=27" defer></script>
<script src="js/ui.js?v=27" defer></script>
<script src="js/api.js?v=27" defer></script>
<script src="js/report.js?v=27" defer></script>
<script src="js/guard.js?v=27" defer></script>
<script src="gen/calc_task.js?v=27" defer></script>
<script src="js/remind.js?v=27" defer></script>
<script src="gen/calc_form.js?v=27" defer></script>
<script src="js/portal_text.js?v=27" defer></script>
<script src="js/page_admin_form_edit.js?v=27" defer></script>
</head>
<body hidden>
<header id="topbar" class="topbar" hidden></header>
<main class="wrap">
<div id="msg" class="msg error" role="alert" hidden></div>
<div id="admin" hidden>
  <h1 id="edit-title">受付項目を作る</h1>
  <form id="edit-form" class="card" novalidate>
    <p id="f-kind" class="sub"></p>
    <div class="field"><label for="f-title">タイトル</label><input type="text" id="f-title" maxlength="200" autocomplete="off"></div>
    <div class="field"><label for="f-desc">説明（なくてもよい）</label><textarea id="f-desc" rows="4"></textarea></div>
    <div id="f-settings"></div>
    <div class="field"><label for="f-start">受付の初め（なくてもよい。空なら作ったときから）</label><input type="date" id="f-start"></div>
    <div class="field"><label for="f-start-time">受付の初めの時刻（なくてもよい。例 9:00）</label><input type="text" id="f-start-time" inputmode="numeric" maxlength="5" autocomplete="off"></div>
    <div class="field"><label for="f-deadline">締切の日</label><input type="date" id="f-deadline"></div>
    <div class="field"><label for="f-deadline-time">締切の時刻（なくてもよい。例 17:00）</label><input type="text" id="f-deadline-time" inputmode="numeric" maxlength="5" autocomplete="off">
      <p class="hint">時刻が空なら、締切の日の 23:59 まで受け付けます。時刻を入れると、その時刻の前まで受け付けます</p></div>
    <div class="field" id="f-target"></div>
    <label class="check" for="f-show"><input type="checkbox" id="f-show" checked> 社員のホームに出す</label>
    <button type="submit" class="btn primary block">保存する</button>
    <a class="btn block" href="admin_forms.html">やめる</a>
  </form>
</div>
</main>
</body>
</html>
