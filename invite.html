<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>端末の登録｜名和電設ポータル</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css?v=2">
<script src="js/boot.js?v=2" defer></script>
<script src="js/config.js?v=2" defer></script>
<script src="js/store.js?v=2" defer></script>
<script src="js/ui.js?v=2" defer></script>
<script src="js/api.js?v=2" defer></script>
<script src="js/page_invite.js?v=2" defer></script>
</head>
<body hidden>
<main class="wrap">
<div id="msg" class="msg error" role="alert" hidden></div>
<h1>端末の登録</h1>
<p id="invite-loading" class="sub">招待を確かめています…</p>
<div id="invite-bad" class="card" hidden>
  <p id="invite-bad-text"></p>
  <a class="btn block" href="index.html">入口へ</a>
</div>
<div id="invite-registered" class="card" hidden>
  <p>この端末は登録済みです。招待は使わずに、そのままログインできます。</p>
  <a class="btn primary block" href="login.html">ログインへ</a>
</div>
<form id="invite-form" class="card" novalidate hidden>
  <p id="invite-who" class="item-title"></p>
  <div class="field">
    <label for="device-name">この端末の名前</label>
    <input type="text" id="device-name" maxlength="60" autocomplete="off">
    <p class="hint">例「田中のiPhone・Safari」。どの端末か、あとで見分けるための名前です（40文字まで）</p>
  </div>
  <button type="submit" class="btn primary block">この端末を登録する</button>
</form>
</main>
</body>
</html>
