<!DOCTYPE html>

<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>部署の日報の一覧｜名和電設ポータル</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css?v=7">
<script src="js/boot.js?v=7" defer></script>
<script src="js/config.js?v=7" defer></script>
<script src="js/store.js?v=7" defer></script>
<script src="js/ui.js?v=7" defer></script>
<script src="js/api.js?v=7" defer></script>
<script src="js/guard.js?v=7" defer></script>

<body hidden>
<header id="topbar" class="topbar" hidden></header>
<main class="wrap wide">
<div id="msg" class="msg error" role="alert" hidden></div>

<div id="view" hidden>
  <h1>部署の日報の一覧</h1>
  <p class="sub">数字は実働です。「+」は所定を超えた日、「未」は未入力の出勤日、「－」は見られる部署にいない日です。名前を押すと、その人の日報を見るだけで開きます（直せません）。休暇は、休暇の申請ができたら出ます。</p>
  <div class="period-nav">
    <button type="button" id="prev" class="btn">前の期間</button>
    <h2 id="period-label" class="period-label"></h2>
    <button type="button" id="next" class="btn">次の期間</button>
  </div>
  <label for="dept">部署</label>
  <select id="dept"></select>
  <p id="empty" class="sub" hidden>この期間に見られる社員はいません。</p>
  <div class="manager-scroll"><table id="table" class="manager-table"></table></div>
  <a class="btn block" href="home.html">ホームへ戻る</a>
</div>
</main>
</body>
</html>
