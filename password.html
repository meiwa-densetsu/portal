<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>パスワードの変更｜名和電設ポータル</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css?v=7">
<script src="js/boot.js?v=7" defer></script>
<script src="js/config.js?v=7" defer></script>
<script src="js/store.js?v=7" defer></script>
<script src="js/ui.js?v=7" defer></script>
<script src="js/api.js?v=7" defer></script>
<script src="js/guard.js?v=7" defer></script>
<script src="js/page_password.js?v=7" defer></script>
</head>
<body hidden>
<header id="topbar" class="topbar" hidden></header>
<main class="wrap">
<div id="msg" class="msg error" role="alert" hidden></div>
<h1>パスワードの変更</h1>
<p id="temp-note" class="msg info" hidden>仮パスワードのままです。自分だけのパスワードに変えてください。変えるまで、他の画面には進めません。</p>
<form id="password-form" class="card" novalidate hidden>
  <input type="text" id="username" autocomplete="username" hidden>
  <div class="field">
    <label for="current">今のパスワード（仮パスワード）</label>
    <input type="password" id="current" maxlength="300" autocomplete="current-password">
  </div>
  <div class="field">
    <label for="next">新しいパスワード</label>
    <input type="password" id="next" maxlength="300" autocomplete="new-password">
    <p class="hint">8文字以上。名前と同じもの、「12345678」「abcdefgh」のような並び、同じ文字だけのもの、よく使われるものは使えません</p>
  </div>
  <div class="field">
    <label for="again">新しいパスワード（確認のため、もう一度）</label>
    <input type="password" id="again" maxlength="300" autocomplete="new-password">
  </div>
  <button type="submit" class="btn primary block">パスワードを変更する</button>
  <a id="back" class="btn block" href="home.html" hidden>やめてホームへ戻る</a>
</form>
</main>
</body>
</html>
