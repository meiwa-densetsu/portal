<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>日報（表）｜名和電設ポータル</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css?v=8">
<script src="js/boot.js?v=8" defer></script>
<script src="js/config.js?v=8" defer></script>
<script src="js/store.js?v=8" defer></script>
<script src="js/ui.js?v=8" defer></script>
<script src="js/api.js?v=8" defer></script>
<script src="js/guard.js?v=8" defer></script>
<script src="gen/calc_worktime.js?v=8" defer></script>
<script src="gen/calc_report.js?v=8" defer></script>
<script src="js/bulk.js?v=8" defer></script>
<script src="js/grid_core.js?v=8" defer></script>
<script src="js/grid.js?v=8" defer></script>
<script src="js/report_text.js?v=8" defer></script>
<script src="js/page_report_grid.js?v=8" defer></script>
</head>
<body hidden>
<header id="topbar" class="topbar" hidden></header>
<main class="wrap full">
<div id="msg" class="msg error" role="alert" hidden></div>

<div id="view" hidden>
  <h1 id="title">日報（表）</h1>
  <p class="msg warn only-narrow">パソコン向けの画面です。スマホでは「1日ずつ入力」が使いやすいです。</p>
  <div class="item-actions">
    <a id="to-day" class="btn" href="report.html?view=day">1日ずつ入力</a>
  </div>
  <div id="admin-bar" class="card" hidden>
    <div class="field">
      <label for="emp-select">社員</label>
      <select id="emp-select"></select>
    </div>
    <p id="other-note" class="msg warn" hidden></p>
  </div>

  <p id="closed-note" class="msg warn" hidden></p>
  <div class="period-nav">
    <button type="button" id="prev" class="btn">前の期間</button>
    <h2 id="period-label" class="period-label"></h2>
    <button type="button" id="next" class="btn">次の期間</button>
  </div>

  <div class="item-actions grid-tools">
    <button type="button" id="save" class="btn primary">保存</button>
    <button type="button" id="copy-prev" class="btn">前日と同じ</button>
    <button type="button" id="use-pattern" class="btn">定型パターン</button>
    <button type="button" id="bulk" class="btn">まとめて適用</button>
    <button type="button" id="revert-row" class="btn">選んだ行を元に戻す</button>
    <button type="button" id="revert-all" class="btn">保存していない変更をすべて取り消す</button>
  </div>
  <p class="sub">セルを選んで打つと入ります（Enter で下へ、矢印で移動）。Excel からの貼り付け・コピー、右下の小さな四角を下へ引っぱると写せます。時刻は「9」「930」でも入ります。昼・夜のどちらの欄に入れても、保存のときに時刻から日勤・夜勤を決め直します。</p>

  <div id="grid" class="grid-box"></div>

  <section id="conflicts" class="card" aria-labelledby="conflicts-title" hidden>
    <h2 id="conflicts-title">他の画面で更新された日</h2>
    <p class="sub">あなたの入力は表に残っています。日ごとに選んでください。</p>
    <ul id="conflict-list" class="list"></ul>
  </section>

  <div class="card">
    <dl id="totals" class="kv"></dl>
    <p class="sub">正式な給与計算ではありません（目安です）。</p>
  </div>

  <a class="btn block" href="home.html">ホームへ戻る</a>
</div>
</main>
</body>
</html>
